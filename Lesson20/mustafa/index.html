<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Booking</title>
    <link rel="stylesheet" href="styles.css"/>
  </head>
  <body>
    <div class="container"> 
      <header>
        <h1>Book an Appointment</h1>
      </header>

      <form class="booking">
        <section class="calender">
          <label for="date">Select a date</label>
          <input type="date" id="date" />
          <label for="name">Username</label>
          <input type="text" id="name" placeholder="Enter your username" />
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="Enter your email" />
          <h2 id="timelots-heading">Available Time Slots</h2>
          <fieldset class="timelots" aria-labelledby="timelots-heading">
            <legend class="hidden">Choose a time slot</legend>
            <button class="slot" type="button" aria-label="Select 09:00 time slot">09:00</button>
            <button class="slot" type="button" aria-label="Select 10:30 time slot">10:30</button>
            <button class="slot" type="button" aria-label="Select 13:00 time slot">13:00</button>
            <button class="slot" type="button" aria-label="Select 14:30 time slot">14:30</button>
            <button class="slot" type="button" aria-label="Select 16:00 time slot">16:00</button>
          </fieldset>
        </section>

        <aside class="summary">
          <h2>Your Appointment</h2>
          <p>Date: <span id="selected-date"></span></p>
          <p>Time: <span id="selected-time"></span></p>
          <p>Username: <span id="selected-username"></span></p>
          <p>E-mail: <span id="selected-email"></span></p>
          <button id="confirm" disabled type="submit">Confirm Booking</button>
        </aside>
      </form>

      <div class="hidden" id="confirmation-message">
        <h2>Booking is Confirmed.</h2>
        <p>Date: <span id="confirmed-date">-</span></p>
        <p>Time: <span id="confirmed-time">-</span></p>
        <p>Username: <span id="confirmed-username">-</span></p>
        <p>Email: <span id="confirmed-email">-</span></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
